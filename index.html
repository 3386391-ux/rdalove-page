<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的结婚纪念日 ❤️</title>

<link rel="preload" href="background.jpg" as="image">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft YaHei",Arial,sans-serif;
    color:#fff;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.6),
        rgba(0,0,0,.25),
        rgba(0,0,0,.6)
    ),
    url("background.jpg") center center no-repeat;

    background-size:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.15);
    z-index:1;
}

.content{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:20px;
}

h1{
    font-size:clamp(1.8rem,5vw,3.5rem);
    margin-bottom:15px;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
}

.heart{
    display:inline-block;
    animation:heartbeat 1.5s infinite;
}

@keyframes heartbeat{
    0%,20%,40%,100%{
        transform:scale(1);
    }
    10%,30%{
        transform:scale(1.25);
    }
}

.anniversary{
    font-size:1rem;
    opacity:.95;
    margin-bottom:25px;
}

.timer-container{
    margin-bottom:20px;
    line-height:1.8;
    font-size:1.1rem;
}

.quote{
    max-width:800px;
    min-height:80px;

    line-height:1.8;
    font-size:1.1rem;

    margin-top:15px;
    padding:0 10px;

    position:relative;
}

.quote::after{
    content:"|";
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.music-control{
    margin-top:30px;
}

.music-control button{
    border:none;
    cursor:pointer;

    padding:12px 24px;
    border-radius:30px;

    color:#fff;
    background:rgba(255,255,255,.18);

    backdrop-filter:blur(5px);

    transition:.3s;
}

.music-control button:hover{
    background:rgba(255,255,255,.3);
}

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

audio{
    display:none;
}

@media (max-width:768px){

    h1{
        font-size:2rem;
    }

    .quote{
        font-size:1rem;
    }

    .timer-container{
        font-size:1rem;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<canvas class="particles"></canvas>

<div class="content">

    <h1>
        ❤️ 我们已经结婚
        <span id="weddingDays">0</span>
        天 ❤️
    </h1>

    <div class="anniversary">
        💍 2026年05月20日 · 我们的结婚纪念日
    </div>

    <div class="timer-container">
        <div id="datePart"></div>
        <div id="timePart"></div>
    </div>

    <div class="quote" id="quote"></div>

    <div class="music-control">
        <button id="musicToggle">
            播放音乐 🎵
        </button>
    </div>

</div>

<audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
(() => {

"use strict";

/* =====================
   配置
===================== */

const CONFIG = {

    weddingDate: new Date("2026-05-20"),

    quotes: [

        "从恋人到夫妻，我们终于成为了一家人。",

        "余生很长，很幸运身边的人一直是你。",

        "感谢你成为我生命中最重要的人。",

        "有你的地方，就是我最温暖的家。",

        "婚姻不是终点，而是幸福生活的开始。",

        "柴米油盐是生活，而你是生活里的糖。",

        "执子之手，与子偕老。",

        "愿岁月可回首，且以深情共白头。",

        "谢谢你陪我从青丝走向白发。",

        "你是我的爱人，也是我的家人。",

        "今天比昨天更爱你，明天比今天更爱你。",

        "愿我们一起走过每一个春夏秋冬。",

        "婚礼那天的誓言，我会用一生去兑现。",

        "陪伴，是最长情的告白。",

        "平淡日子里的每一份温柔，都与你有关。",

        "往后的每一个清晨和黄昏，都想和你一起度过。",

        "余生请多指教，我最爱的老婆。❤️"

    ]
};

/* =====================
   DOM
===================== */

const weddingDaysEl = document.getElementById("weddingDays");
const datePartEl = document.getElementById("datePart");
const timePartEl = document.getElementById("timePart");
const quoteEl = document.getElementById("quote");

const audio = document.getElementById("bgm");
const btn = document.getElementById("musicToggle");

const canvas = document.querySelector(".particles");
const ctx = canvas.getContext("2d");

/* =====================
   结婚天数
===================== */

function updateWeddingDays(){

    const now = new Date();

    const start = new Date(
        CONFIG.weddingDate.getFullYear(),
        CONFIG.weddingDate.getMonth(),
        CONFIG.weddingDate.getDate()
    );

    const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    const days = Math.floor(
        (today - start) / 86400000
    );

    weddingDaysEl.textContent = days;

    const tomorrow = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()+1
    );

    setTimeout(updateWeddingDays, tomorrow - now);
}

/* =====================
   北京时间
===================== */

function updateTime(){

    const now = new Date();

    const formatter = new Intl.DateTimeFormat(
        "zh-CN",
        {
            timeZone:"Asia/Shanghai",
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            weekday:"long",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    );

    const parts = formatter.formatToParts(now);

    const get = type =>
        parts.find(p=>p.type===type)?.value || "";

    datePartEl.textContent =
        `${get("year")}年${get("month")}月${get("day")}日 ${get("weekday")}`;

    timePartEl.textContent =
        `${get("hour")}:${get("minute")}:${get("second")}`;
}

setInterval(updateTime,1000);

/* =====================
   打字机
===================== */

let quotes = [...CONFIG.quotes]
.sort(()=>Math.random()-0.5);

let quoteIndex = 0;

function typeWriter(text){

    quoteEl.textContent="";

    let i = 0;

    const timer = setInterval(()=>{

        quoteEl.textContent += text[i];

        i++;

        if(i >= text.length){

            clearInterval(timer);

            setTimeout(()=>{

                quoteIndex++;

                if(
                    quoteIndex >= quotes.length
                ){
                    quoteIndex = 0;

                    quotes =
                    [...CONFIG.quotes]
                    .sort(()=>Math.random()-0.5);
                }

                typeWriter(
                    quotes[quoteIndex]
                );

            },2500);
        }

    },150);
}

/* =====================
   音乐
===================== */

btn.addEventListener("click",()=>{

    if(audio.paused){

        audio.volume = 1;

        audio.play();

        btn.textContent =
        "暂停音乐 ⏸️";

    }else{

        audio.pause();

        btn.textContent =
        "播放音乐 🎵";
    }
});

/* =====================
   粒子特效
===================== */

let particles = [];

function resizeCanvas(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    const count =
    window.innerWidth < 768
    ? 20
    : 40;

    particles = Array.from(
        {length:count},
        createParticle
    );
}

function createParticle(){

    return {

        x:Math.random()*canvas.width,

        y:Math.random()*canvas.height,

        size:Math.random()*6+3,

        speed:Math.random()*0.8+0.3,

        opacity:Math.random()*0.8
    };
}

function drawParticles(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        ctx.beginPath();

        ctx.globalAlpha =
        p.opacity;

        ctx.fillStyle =
        "#ff7aa8";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        p.y -= p.speed;

        if(p.y < -20){

            p.y =
            canvas.height+20;

            p.x =
            Math.random()*canvas.width;
        }
    });

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        drawParticles
    );
}

/* =====================
   初始化
===================== */

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

updateWeddingDays();

updateTime();

typeWriter(quotes[0]);

drawParticles();

})();
</script>

</body>
</html>
